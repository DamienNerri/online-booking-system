<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réservation d'Hôtel</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Réservation d'Hôtel</h1>
        <div id="session" class="session hidden">
            <span id="who"></span>
            <span id="node" class="node" title="Nœud ayant répondu"></span>
            <button id="logout" class="link">Déconnexion</button>
        </div>
    </header>

    <main>
        <!-- Bandeau de message -->
        <div id="message" class="message hidden"></div>

        <!-- Authentification -->
        <section id="auth" class="card">
            <h2>Connexion</h2>
            <label>Email <input id="email" type="email" placeholder="vous@exemple.fr" /></label>
            <label>Mot de passe <input id="password" type="password" placeholder="8 caractères min." /></label>
            <div class="row">
                <button id="btn-login">Se connecter</button>
                <button id="btn-register" class="secondary">Créer un compte</button>
            </div>
        </section>

        <!-- Application (après connexion) -->
        <section id="app" class="hidden">
            <div class="card">
                <h2>Rechercher une chambre</h2>
                <div class="row">
                    <label>Type de chambre
                        <select id="type">
                            <option value="HOTEL_ROOM">Chambre d'hôtel</option>
                        </select>
                    </label>
                    <label>Date d'arrivée <input id="from" type="date" /></label>
                    <label>Date de départ <input id="to" type="date" /></label>
                    <button id="btn-search">Rechercher</button>
                </div>
                <div id="results" class="results"></div>
                <button id="btn-book" class="hidden">Réserver ces chambres</button>
            </div>

            <div class="card">
                <h2>Mes réservations</h2>
                <div id="bookings" class="bookings"><p class="muted">Aucune réservation pour l'instant.</p></div>
            </div>
        </section>
    </main>

    <footer>
        <span>Système distribué — ASP.NET Core · PostgreSQL · Nginx</span>
    </footer>

    <script src="app.js"></script>
</body>
</html>
