events {}

http {
    # Résolveur DNS interne de Docker : permet de re-résoudre le nom "api" à
    # chaque requête et donc de répartir la charge sur les réplicas (round-robin).
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        # Fichiers statiques du front.
        root /usr/share/nginx/html;
        index index.html;

        # Health check du répartiteur lui-même.
        location = /lb-health {
            return 200 "lb-ok\n";
            add_header Content-Type text/plain;
        }

        # API : proxy vers un nœud applicatif disponible.
        location /api/ {
            set $api api:8080;
            proxy_pass http://$api$request_uri;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Health applicatif (renvoie le nœud ayant répondu).
        location = /health {
            set $api_h api:8080;
            proxy_pass http://$api_h/health;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Front SPA : sert les fichiers, repli sur index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
